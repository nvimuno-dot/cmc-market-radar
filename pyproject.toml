[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmc-market-radar"
version = "0.1.0"
description = "Cross-sectional crypto market radar built on the CoinMarketCap Pro API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nvimuno-dot" }]
keywords = ["coinmarketcap", "market-data", "trading-tools", "agent"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cmc-radar = "cmc_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
